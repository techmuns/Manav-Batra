name: Ingest Screener financials

on:
  schedule:
    # Daily at 02:30 UTC (08:00 IST).  Adjust as Screener cadence requires.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-screener
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run ingestion
        run: npm run ingest:screener

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/generated/screener-financials.json; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/screener-financials.json
          git commit -m "chore(data): refresh Screener snapshot $(date -u +%Y-%m-%d)"
          git push
