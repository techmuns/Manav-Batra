name: Ingest financials (probe + seed snapshot)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker, or ALL to iterate every entry in data/companies.ts"
        required: true
        default: "RELIANCE"
      concurrency:
        description: "Parallel in-flight requests (only matters for ALL)"
        required: false
        default: "3"
      delay_ms:
        description: "Per-request delay in milliseconds"
        required: false
        default: "150"
      seed_snapshot:
        description: "After probing, also map markdown -> snapshot.ts (true/false)"
        required: false
        default: "true"
      commit_samples:
        description: "Commit the captured samples + snapshot to the branch"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: probe-apis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Probe APIs (capture raw markdown into data/api-samples/)
        env:
          DASH_TOOLS_KEY: ${{ secrets.DASH_TOOLS_KEY }}
          MUNSHOT_ACCESS_TOKEN: ${{ secrets.MUNSHOT_ACCESS_TOKEN }}
        run: |
          npx tsx scripts/ingest/probe-apis.ts \
            --ticker=${{ inputs.ticker }} \
            --concurrency=${{ inputs.concurrency }} \
            --delay-ms=${{ inputs.delay_ms }}

      - name: Seed snapshot from captured samples
        if: ${{ inputs.seed_snapshot == 'true' }}
        run: |
          if [ "${{ inputs.ticker }}" = "ALL" ]; then
            npm run ingest:tool-output
          else
            npm run ingest:tool-output -- ${{ inputs.ticker }}
          fi

      - name: Upload samples as artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: api-samples-${{ inputs.ticker }}
          path: data/api-samples/*.json
          retention-days: 14

      - name: Commit samples + snapshot to branch
        if: ${{ inputs.commit_samples == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api-samples app/api/scores/snapshot.ts
          # `git diff --cached --quiet` catches modifications AND newly staged
          # files (a path-scoped `git diff -- <path>` only sees tracked
          # changes, so probe's untracked output was previously skipped).
          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping."
            exit 0
          fi
          git commit -m "data: ingest financials for ${{ inputs.ticker }}"
          git push origin HEAD:${GITHUB_REF_NAME}
