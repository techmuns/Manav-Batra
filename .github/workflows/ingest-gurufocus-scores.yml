name: Ingest GuruFocus scores

on:
  schedule:
    # Weekly Saturday 03:00 UTC.  GuruFocus refresh cadence is monthly+ in
    # practice, so once a week is plenty.
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-gurufocus
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run ingestion
        run: npm run ingest:gurufocus

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/generated/gurufocus-scores.json app/api/scores/gurufocus-snapshot.ts; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/gurufocus-scores.json app/api/scores/gurufocus-snapshot.ts
          git commit -m "chore(data): refresh GuruFocus snapshot $(date -u +%Y-%m-%d)"
          git push
